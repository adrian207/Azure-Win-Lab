# Pre-commit hooks for Terraform quality
# Install: pip install pre-commit
# Setup: pre-commit install

repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.83.5
    hooks:
      # Format Terraform files
      - id: terraform_fmt
        name: Terraform format
      
      # Validate Terraform syntax
      - id: terraform_validate
        name: Terraform validate
      
      # Security scanning with tfsec
      - id: terraform_tfsec
        name: Terraform security scan
        args:
          - --args=--minimum-severity=MEDIUM
      
      # Generate documentation
      - id: terraform_docs
        name: Terraform docs
        args:
          - --hook-config=--path-to-file=README_MODULES.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=true
      
      # Check for Terraform version constraints
      - id: terraform_providers_lock
        name: Terraform providers lock
      
      # Validate naming conventions
      - id: terraform_validate_naming
        name: Terraform naming validation
        args:
          - --tf-init-args=-backend=false

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # Prevent large files
      - id: check-added-large-files
        args: ['--maxkb=1000']
      
      # Check YAML syntax
      - id: check-yaml
        args: ['--safe']
      
      # Check JSON syntax
      - id: check-json
      
      # Detect private keys
      - id: detect-private-key
      
      # Trim trailing whitespace
      - id: trailing-whitespace
      
      # Ensure files end with newline
      - id: end-of-file-fixer
      
      # Check merge conflicts
      - id: check-merge-conflict

  # Secrets detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        name: Detect secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: .*(tfvars|env)$

